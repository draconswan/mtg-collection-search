<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<!-- Include header -->
<div th:replace="~{fragments/header :: body}"></div>
<div class="container mt-5">
    <h2>Admin Panel</h2>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div class="btn-toolbar mb-4 align-items-start" role="toolbar">
        <div class="btn-group me-2" role="group">
            <button id="refreshBtn" class="btn btn-primary">Update Card Database</button>
        </div>
        <div id="updateContainer" style="display:none;">
            <label class="form-label fw-bold">Update Progress</label>
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="progress flex-grow-1" style="height: 25px;">
                    <div id="updateProgressBar"
                         class="progress-bar progress-bar-striped progress-bar-animated bg-success px-2"
                         role="progressbar"
                         style="width: 0%;">
                        0 cards
                    </div>
                </div>
                <div id="refreshLog"
                     class="px-2"
                     style="min-width: 220px; font-size: 0.9rem; white-space: nowrap;">
                </div>
            </div>

        </div>
    </div>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td>
                <ul class="list-unstyled mb-0">
                    <li th:each="role : ${user.roles}" th:text="${role.name}"></li>
                </ul>
            </td>
            <td>
                <form th:action="@{/admin/promote}" method="post"
                      th:if="${!#lists.contains(user.roles.?[name == 'ROLE_USER'], true)}">
                    <input type="hidden" name="username" th:value="${user.username}"/>
                    <button type="submit" class="btn btn-sm btn-primary">Promote to USER</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<!-- Refresh Options Modal -->
<div class="modal fade" id="refreshOptionsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Database Refresh Options</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="forceCheckbox">
                    <label class="form-check-label" for="forceCheckbox">
                        Force full refresh
                    </label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="updateSetsCheckbox">
                    <label class="form-check-label" for="updateSetsCheckbox">
                        Update Scryfall sets
                    </label>
                </div>
            </div>

            <div class="modal-footer">
                <button id="confirmRefreshBtn" class="btn btn-primary">
                    Start Update
                </button>
            </div>
        </div>
    </div>
</div>
<script type="module">
    import {runDatabaseRefresh} from "/js/refreshWebsocket.js";

    const btn = document.getElementById("refreshBtn");
    const container = document.getElementById("updateContainer");
    const log = document.getElementById("refreshLog");
    const bar = document.getElementById("updateProgressBar");

    const modalEl = document.getElementById("refreshOptionsModal");
    const modal = new bootstrap.Modal(modalEl);

    const forceCheckbox = document.getElementById("forceCheckbox");
    const updateSetsCheckbox = document.getElementById("updateSetsCheckbox");
    const confirmRefreshBtn = document.getElementById("confirmRefreshBtn");

    // Step 1: clicking the main button opens the modal
    btn.addEventListener("click", () => {
        modal.show();
    });

    confirmRefreshBtn.addEventListener("click", () => {
        modal.hide()

        // Wait for modal to fully close before touching focus-sensitive UI
        modalEl.addEventListener("hidden.bs.modal", () => {
            startRefresh();
        }, {once: true});
    });

    function startRefresh() {
        container.style.display = "block";
        log.innerHTML = "";
        bar.classList.remove("bg-success");
        bar.classList.add("bg-primary", "progress-bar-striped", "progress-bar-animated");
        bar.style.width = "100%";
        bar.textContent = "0 cards processed";

        runDatabaseRefresh({
            force: forceCheckbox.checked,
            updateSets: updateSetsCheckbox.checked,

            onStatus: msg => log.innerHTML = `<div>${msg}</div>`,
            onCount: count => {
                bar.style.width = "100%";
                if (count > 0) {
                    bar.textContent = `${count} cards processed`;
                }
            },
            onComplete: result => {
                log.innerHTML = `<div>Completed</div>`;
                bar.classList.remove("progress-bar-striped", "progress-bar-animated");
                bar.classList.add("bg-success");
            }
        });
    }
</script>
</body>
</html>

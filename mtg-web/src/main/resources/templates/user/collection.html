<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Collection</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
          integrity="sha384-4LISF5TTJX/fLmGSxO53rV4miRxdg84mZsxmO8Rx5jGtp/LbrixFETvWa5a6sESd"
          crossorigin="anonymous"/>
    <link rel="stylesheet" href="/css/print.css" media="print"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <script src="/js/mana-symbols.js" defer></script>
    <style>
        body {
            padding-bottom: 60px;
        }
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .card {
            border-radius: 8px;
            padding: 1rem 1.25rem;
            border: 1px solid #333;
        }

        .card-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.35rem;
        }

        .card-value {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .color-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.75rem;
        }

        .color-table th,
        .color-table td {
            padding: 0.4rem 0.6rem;
            border-bottom: 1px solid #333;
            text-align: left;
        }

        .color-table th {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #bbb;
        }

        .color-pill {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
<!-- Include header -->
<div th:replace="~{fragments/header :: body}"></div>
<div class="container py-4">
    <div class="row align-items-center mb-4">
        <div class="col">
            <h1 class="mb-0"><span sec:authentication="name"></span>'s Collection</h1>
            <div class="col-auto">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#csvImportModal">
                    <i class="bi bi-upload"></i> Import CSV
                </button>
            </div>
        </div>
    </div>
    <div class="overview-grid">
        <div class="card">
            <div class="card-title">Total Cards</div>
            <div class="card-value">
                <span th:text="${overview.totalCards}"></span>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Total Mythics</div>
            <div class="card-value">
                <span th:text="${overview.numMythics}"></span>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Total Rares</div>
            <div class="card-value">
                <span th:text="${overview.numRares}"></span>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Total Uncommons</div>
            <div class="card-value">
                <span th:text="${overview.numUncommons}"></span>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Total Commons</div>
            <div class="card-value">
                <span th:text="${overview.numCommons}"></span>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Number of Sets</div>
            <div class="card-value">
                <span th:text="${overview.numSets}"></span>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Proxies</div>
            <div class="card-value">
                <span th:text="${overview.numProxies}"></span>
            </div>
        </div>
        <div class="card">
            <div class="card-title">Approximate Value</div>
            <div class="card-value">
                <span th:text="${'$' + #numbers.formatDecimal(overview.approximateValue, 1, 'COMMA', 2, 'POINT')}"></span>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="card-title">Cards by Color</div>
        <table class="color-table">
            <thead>
            <tr>
                <th>Color</th>
                <th>Count</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${overview.cardsByColor}">
                <td>
                    <span class="color-col" th:text="${entry.key}"></span>
                </td>
                <td th:text="${entry.value}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div class="modal fade" id="csvImportModal" tabindex="-1" aria-labelledby="csvImportModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/collection/upload-csv}" method="post" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title" id="csvImportModalLabel">Import Collection CSV</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label for="csvFile" class="form-label">CSV File</label>
                        <input type="file" id="csvFile" name="file" accept=".csv" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="site" class="form-label">Source Site</label>
                        <select id="site" name="site" class="form-select" required>
                            <option value="">Select site</option>
                            <option value="MOXFIELD">Moxfield</option>
                            <option value="MANABOX">Manabox</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </div>
            </form>
        </div>
    </div>
</div>
<footer class="text-center fixed-bottom bg-light border-top py-2">
    Price Data last updated:
    <span th:text="${#temporals.format(overview.lastRefresh, 'yyyy-MM-dd HH:mm')}">
    </span>
</footer>
</body>
</html>

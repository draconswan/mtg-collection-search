<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Deck Checklist</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
            integrity="sha384-4LISF5TTJX/fLmGSxO53rV4miRxdg84mZsxmO8Rx5jGtp/LbrixFETvWa5a6sESd"
            crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/print.css" media="print"/>
    <link rel="stylesheet" href="/css/style.css"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <script src="/js/mana-symbols.js" defer></script>
    <script src="/js/card-preview.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".add-card-btn").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const deckId = btn.dataset.deckId;
                    const cardId = btn.dataset.cardId;
                    const zone = btn.dataset.zone;
                    // Include CSRF token
                    const csrf = document.querySelector("input[name='_csrf']").value;
                    // Build query string
                    const query = new URLSearchParams({
                        cardId: cardId,
                        zone: zone,
                        quantity: 1
                    });
                    try {
                        await fetch(`/api/v1/decks/${deckId}/update-checked-existing?` + query.toString(), {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "X-CSRF-TOKEN": csrf
                            }
                        });
                        // Rebuild URL with current filters
                        const params = new URLSearchParams(window.location.search);
                        window.location.href = `/user/decks/all-missing?${params.toString()}`;
                    } catch (err) {
                        console.error("Update failed", err);
                    }
                });
            });
        });
    </script>
</head>
<body>
<div th:replace="~{fragments/header :: body}"></div>
<div id="card-preview" class="card-preview"></div>
<div class="container py-4">
    <h1 class="mb-4">All Missing Cards</h1>
    <p class="text-muted">
        This page lists every card across all decks that is not marked as acquired.
    </p>
    <!-- Pagination Top -->
    <div class="no-print mb-3">
        <nav aria-label="Pagination">
            <ul class="pagination justify-content-center">
                <!-- Previous -->
                <li class="page-item" th:classappend="${page > 0} ? '' : 'disabled'">
                    <a class="page-link"
                       th:href="@{/user/decks/all-missing(
                                   page=${page - 1},
                                   size=${size},
                                   deckIds=${deckIds},
                                   types=${types}
                               )}">
                        Previous
                    </a>
                </li>
                <!-- First page -->
                <li class="page-item" th:classappend="${page == 0} ? 'active'">
                    <a class="page-link"
                       th:href="@{/user/decks/all-missing(
                                   page=0,
                                   size=${size},
                                   deckIds=${deckIds},
                                   types=${types}
                               )}">
                        1
                    </a>
                </li>
                <!-- Ellipsis before window -->
                <li class="page-item disabled" th:if="${page > 3}">
                    <span class="page-link">…</span>
                </li>
                <!-- Windowed pages -->
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(page-2, page+2)}"
                    th:if="${i > 0 and i < totalPages}"
                    th:classappend="${i == page} ? 'active'">
                    <a class="page-link"
                       th:text="${i + 1}"
                       th:href="@{/user/decks/all-missing(
                                   page=${i},
                                   size=${size},
                                   deckIds=${deckIds},
                                   types=${types}
                               )}">
                    </a>
                </li>
                <!-- Ellipsis after window -->
                <li class="page-item disabled" th:if="${page < totalPages - 3}">
                    <span class="page-link">…</span>
                </li>
                <!-- Last page -->
                <li class="page-item"
                    th:classappend="${page == totalPages - 1} ? 'active'">
                    <a class="page-link"
                       th:text="${totalPages}"
                       th:href="@{/user/decks/all-missing(
                                   page=${totalPages - 1},
                                   size=${size},
                                   deckIds=${deckIds},
                                   types=${types}
                               )}">
                    </a>
                </li>
                <!-- Next -->
                <li class="page-item" th:classappend="${page < totalPages - 1} ? '' : 'disabled'">
                    <a class="page-link"
                       th:href="@{/user/decks/all-missing(
                                   page=${page + 1},
                                   size=${size},
                                   deckIds=${deckIds},
                                   types=${types}
                               )}">
                        Next
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    <!-- Loop over sets -->
    <div class="my-2" th:each="entry, setIter : ${groupedBySet}">
        <!-- Collapsible header -->
        <div class="set-header"
             data-bs-toggle="collapse"
             th:attr="data-bs-target='#set-' + ${setIter.index}">
            <img th:src="@{/set-icon/{code}.svg(code=${entry.value[0].base().getSetCode()})}" height="20">
            <strong th:text="${entry.value[0].base().getSetName()}"></strong>
        </div>
        <!-- Collapsible content -->
        <div class="collapse show mt-2"
             th:id="'set-' + ${setIter.index}">
            <div class="list-group mb-4">
                <!-- Loop over cards in this set -->
                <div class="list-group-item card-entry"
                     th:each="card, iter : ${entry.value}">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <button type="button"
                                    class="btn btn-sm btn-success rounded-pill p-1 add-card-btn"
                                    th:attr="data-deck-id=${card.base().getDeckId()},
                                             data-card-id=${card.base().getCardId()},
                                             data-zone=${card.base().getLocation()}">
                                <i class="bi bi-plus"></i>
                            </button>
                            <a th:href="${card.base().getScryfallUri()}"
                               th:text="${card.base().displayName()}"
                               target="_blank"
                               rel="noopener noreferrer"
                               class="card-link"
                               th:attr="data-img-url=${card.base().getImageUris().normal}"></a>
                            <span class="quantity-pill"
                                  th:text="'x' + ${card.base().getQuantity()}"></span>
                            <span class="color-col" th:text="${card.base().getManaCost()}"></span>
                        </div>
                        <div>
                            <div class="deck-name">
                                <span th:text="${card.base().getDeckName()}"></span>
                                <span th:each="color : ${card.deckColors}"
                                      th:attr="data-mana=${color}"
                                      class="mana-symbol me-1"
                                      th:text="${color}">
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Pagination Bottom -->
    <div class="no-print mt-4">
        <nav aria-label="Pagination">
            <ul class="pagination justify-content-center">
                <!-- Previous -->
                <li class="page-item" th:classappend="${page > 0} ? '' : 'disabled'">
                    <a class="page-link"
                       th:href="@{/user/decks/all-missing(
                                   page=${page - 1},
                                   size=${size},
                                   deckIds=${deckIds},
                                   types=${types}
                               )}">
                        Previous
                    </a>
                </li>
                <!-- First page -->
                <li class="page-item" th:classappend="${page == 0} ? 'active'">
                    <a class="page-link"
                       th:href="@{/user/decks/all-missing(
                                   page=0,
                                   size=${size},
                                   deckIds=${deckIds},
                                   types=${types}
                               )}">
                        1
                    </a>
                </li>
                <!-- Ellipsis before window -->
                <li class="page-item disabled" th:if="${page > 3}">
                    <span class="page-link">…</span>
                </li>
                <!-- Windowed pages -->
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(page-2, page+2)}"
                    th:if="${i > 0 and i < totalPages}"
                    th:classappend="${i == page} ? 'active'">
                    <a class="page-link"
                       th:text="${i + 1}"
                       th:href="@{/user/decks/all-missing(
                                   page=${i},
                                   size=${size},
                                   deckIds=${deckIds},
                                   types=${types}
                               )}">
                    </a>
                </li>
                <!-- Ellipsis after window -->
                <li class="page-item disabled" th:if="${page < totalPages - 3}">
                    <span class="page-link">…</span>
                </li>
                <!-- Last page -->
                <li class="page-item"
                    th:classappend="${page == totalPages - 1} ? 'active'">
                    <a class="page-link"
                       th:text="${totalPages}"
                       th:href="@{/user/decks/all-missing(
                                   page=${totalPages - 1},
                                   size=${size},
                                   deckIds=${deckIds},
                                   types=${types}
                               )}">
                    </a>
                </li>
                <!-- Next -->
                <li class="page-item" th:classappend="${page < totalPages - 1} ? '' : 'disabled'">
                    <a class="page-link"
                       th:href="@{/user/decks/all-missing(
                                   page=${page + 1},
                                   size=${size},
                                   deckIds=${deckIds},
                                   types=${types}
                               )}">
                        Next
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
